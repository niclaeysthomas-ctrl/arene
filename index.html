<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L'Arène">
<link rel="manifest" href='data:application/manifest+json,{"name":"L%27AR%C3%88NE","short_name":"Ar%C3%A8ne","display":"standalone","background_color":"%230a0e18","theme_color":"%230a0e18","start_url":".","icons":[]}'>
<title>L'ARÈNE — dojo de tes convictions</title>
<style>
  :root{
    --bg:#0a0e18; --bg2:#111726; --bg3:#182234; --bg4:#212d44; --line:#2b3750;
    --txt:#eaf0fb; --dim:#96a3c0; --dim2:#64728f;
    --acc:#4aa3ff; --acc2:#83c5ff;        /* bleu clair azur — l'app / toi */
    --def:#34e0b0;                          /* ta défense (mint) */
    --att:#ffc24d;                          /* ton estocade (or) */
    --adv:#b98bff;                          /* la position adverse (violet doux) */
    --study:#2fd6d0;                        /* études & données (cyan) */
    --ok:#3ecf7a; --bad:#ff6b7a; --r:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;line-height:1.55}
  #app{max-width:580px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
  main{flex:1;padding:12px 16px calc(100px + env(safe-area-inset-bottom))}
  header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:19px;letter-spacing:4px}
  .logo b{color:var(--acc)}
  .hbadges{display:flex;gap:7px}
  .hb{font-weight:800;font-size:13px;background:var(--bg2);border:1px solid var(--line);padding:6px 11px;border-radius:20px;display:flex;align-items:center;gap:4px}
  .hb.lvl{color:var(--acc2)}
  .hb.streak{color:var(--att)}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  h1.page{font-size:23px;font-weight:900;margin:6px 0 4px;letter-spacing:.3px}
  .page-sub{color:var(--dim);font-size:13.5px;margin-bottom:16px}
  .sub{color:var(--dim);font-size:13px}
  .mini{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:1.3px;font-weight:800}

  .hero{background:linear-gradient(140deg,#102340,#123253 52%,#0d3340);position:relative;overflow:hidden;margin-bottom:14px;border-color:#243a5c}
  .hero .lvltag{font-size:11px;color:#a9b8d6;text-transform:uppercase;letter-spacing:2px;font-weight:800}
  .hero .lvlname{font-size:25px;font-weight:900;margin:3px 0 12px;background:linear-gradient(90deg,var(--acc2),var(--study));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .xpbar{height:9px;background:#0009;border-radius:5px;overflow:hidden}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--study));border-radius:5px;transition:width .5s}
  .hero .xptxt{font-size:12px;color:#a9b8d6;margin-top:7px;display:flex;justify-content:space-between}

  .quest{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .quest:last-child{border-bottom:none}
  .quest .qi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--bg3);flex-shrink:0}
  .quest .qt{flex:1}
  .quest .qt b{font-size:14.5px;font-weight:700}
  .quest .qt small{display:block;color:var(--dim);font-size:12px}
  .quest .qx{font-size:12px;font-weight:800;color:var(--dim2)}
  .quest.done .qx{color:var(--ok)}
  .quest.done .qi{background:#0f3328}

  .btn{display:block;border:none;border-radius:13px;padding:15px 20px;font-size:15.5px;font-weight:800;cursor:pointer;
    background:var(--acc);color:#04213f;width:100%;text-align:center;margin-top:12px;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .btn.def{background:var(--def);color:#04231d}
  .btn.att{background:var(--att);color:#3a2a00}
  .btn.study{background:var(--study);color:#04231f}
  .btn.small{padding:11px 16px;font-size:14px}
  .btn:disabled{opacity:.4;cursor:default}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2 .btn,.row3 .btn{margin-top:0}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  .tag{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;letter-spacing:.3px}
  .tag.th{background:#16273f;color:var(--acc2)}

  .stance{border-radius:13px;padding:13px 15px;margin-top:10px;font-size:14.5px}
  .stance .lbl{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
  .stance.me{background:#0f2c26;border:1px solid #1d4a41} .stance.me .lbl{color:var(--def)}
  .stance.adv{background:#1e1735;border:1px solid #362a5e} .stance.adv .lbl{color:var(--adv)}
  .stance b{color:#fff}

  .reveal{background:var(--bg3);border-left:3px solid var(--acc);border-radius:0 12px 12px 0;padding:13px 15px;margin-top:12px;font-size:14.5px;color:#dde3f2;animation:fade .3s}
  .reveal.def{border-color:var(--def)} .reveal.att{border-color:var(--att)}
  .reveal.study{border-color:var(--study)} .reveal.src{border-color:var(--dim2)}
  .reveal b{color:#fff} .reveal i{color:#c8cfe8}
  .reveal .lbl{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;color:var(--dim)}
  .reveal.study .lbl{color:var(--study)}
  .estudy{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5}
  .estudy:last-child{border-bottom:none}
  .estudy .esrc{color:var(--study);font-weight:600}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

  .step-h{display:flex;align-items:center;gap:9px;margin:4px 0 2px}
  .step-h .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;flex-shrink:0;color:#04213f}
  .step-h .n.def{background:var(--def);color:#04231d} .step-h .n.att{background:var(--att);color:#3a2a00}
  .step-h .n.acc{background:var(--acc)}
  .step-h b{font-size:15.5px}
  .prompt{color:var(--dim);font-size:13.5px;margin:6px 0 8px}

  .qa{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .qa .q{font-size:14px;color:#e7d7b0;font-weight:600}

  input[type=text],textarea,select{width:100%;background:var(--bg3);border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;color:var(--txt);font-size:15px;font-family:inherit;-webkit-user-select:text;user-select:text}
  textarea{resize:vertical;min-height:74px}

  .srs-card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:center}
  .srs-front{font-size:16.5px;font-weight:700;text-align:center}
  .srs-back{margin-top:14px;font-size:14.5px;color:#dae0f0;border-top:1px solid var(--line);padding-top:14px;animation:fade .3s}

  .positem{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;cursor:pointer}
  .positem .pt{display:flex;align-items:center;gap:8px}
  .positem .pt b{font-size:15px;flex:1}
  .positem .chev{color:var(--dim2);font-size:13px;transition:.2s}
  .positem.open .chev{transform:rotate(90deg)}
  .posbody{margin-top:10px;animation:fade .25s}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center}
  .stat b{display:block;font-size:22px;font-weight:900;color:var(--acc2)}
  .stat small{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .thbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .thbar .tn{width:92px;color:var(--dim);flex-shrink:0}
  .thbar .tt{flex:1;height:8px;background:#0008;border-radius:4px;overflow:hidden}
  .thbar .tt i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--study))}
  .thbar .tv{color:var(--dim2);font-size:12px;width:34px;text-align:right}

  .divider{height:1px;background:var(--line);margin:16px 0}
  .empty{text-align:center;color:var(--dim2);padding:40px 20px;font-size:14px}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,24,.93);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50;max-width:580px;margin:0 auto}
  .nav-i{flex:1;text-align:center;padding:6px 2px;cursor:pointer;color:var(--dim2);transition:.15s}
  .nav-i .ic{font-size:21px;line-height:1}
  .nav-i span{display:block;font-size:10px;font-weight:700;margin-top:3px;letter-spacing:.2px}
  .nav-i.on{color:var(--acc)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));
    background:var(--acc);color:#04213f;font-weight:800;padding:11px 20px;border-radius:24px;z-index:100;
    box-shadow:0 6px 24px #0009;animation:pop .3s}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">L'<b>ARÈNE</b></div>
    <div class="hbadges">
      <div class="hb lvl" id="hbLvl">◆ 1</div>
      <div class="hb streak" id="hbStreak">🔥 0</div>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>

<script src="data.js"></script>
<script src="masterclass.js"></script>
<script src="dossiers.js"></script>
<script src="verdicts.js"></script>
<script>
/* ---------- état ---------- */
const LEVELS=[
  {n:"Bleu",xp:0},{n:"Ferrailleur",xp:80},{n:"Sparring-partner",xp:200},
  {n:"Débatteur",xp:400},{n:"Contradicteur",xp:700},{n:"Orateur",xp:1100},
  {n:"Rhéteur",xp:1700},{n:"Tribun",xp:2500},{n:"Maître de l'Arène",xp:3800}
];
const S=loadState();
function loadState(){
  let s={};try{s=JSON.parse(localStorage.getItem('arene_state')||'{}')}catch(e){}
  s.xp=s.xp||0; s.streak=s.streak||0; s.lastDay=s.lastDay||null;
  s.seen=s.seen||{}; s.srs=s.srs||{}; s.done=s.done||{}; s.todayDuel=s.todayDuel||null; s.studied=s.studied||{}; s.carnet=s.carnet||[]; s.verdictsSeen=s.verdictsSeen||{};
  s.memo=s.memo||{}; s.dossiersSeen=s.dossiersSeen||{};
  return s;
}
function save(){localStorage.setItem('arene_state',JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function dnum(d){return Math.floor(new Date(d).getTime()/864e5)}
function levelIdx(){let i=0;for(let k=0;k<LEVELS.length;k++)if(S.xp>=LEVELS[k].xp)i=k;return i}
function bumpStreak(){
  const t=today();if(S.lastDay===t)return;
  if(S.lastDay && dnum(t)-dnum(S.lastDay)===1)S.streak++;
  else S.streak=1;
  S.lastDay=t;save();
}
function addXp(n){S.xp+=n;save();paintHead()}
let TAB='arene';

/* ---------- helpers ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1500)}
function byId(id){return DEBATS.find(d=>d.id===id)}
function paintHead(){$('#hbLvl').textContent='◆ '+(levelIdx()+1);$('#hbStreak').textContent='🔥 '+S.streak;}
function $(s){return document.querySelector(s)}
function fmtEtude(e){
  const i=e.lastIndexOf(' — ');
  if(i<0)return '<div class="estudy">'+e+'</div>';
  return '<div class="estudy">'+e.slice(0,i)+' <span class="esrc">— '+e.slice(i+3)+'</span></div>';
}
function etudesBlock(d){
  if(!d.etudes||!d.etudes.length)return'';
  return '<div class="reveal study"><span class="lbl">🔬 Études & données</span>'+d.etudes.map(fmtEtude).join('')+'</div>';
}
function sourcesBlock(d){
  return '<div class="reveal src"><span class="lbl">📚 Sources & penseurs</span>'+d.sources.map(s=>'• '+s).join('<br>')+'</div>';
}

/* choisir le duel : priorité non-vus, sinon le moins récemment vu */
function pickDuel(exclude){
  const unseen=DEBATS.filter(d=>!S.seen[d.id] && d.id!==exclude);
  if(unseen.length)return unseen[0].id;
  const pool=DEBATS.filter(d=>d.id!==exclude);
  pool.sort((a,b)=>dnum(S.seen[a.id]||'2000-01-01')-dnum(S.seen[b.id]||'2000-01-01'));
  return (pool[0]||DEBATS[0]).id;
}
function duelOfDay(){
  const t=today();
  if(S.todayDuel && S.todayDuel.day===t) return S.todayDuel.id;
  const id=pickDuel(null);S.todayDuel={day:t,id};save();return id;
}

/* ---------- SRS (SM-2 léger) ---------- */
function srsCardsFor(id){return [id+':def',id+':fail']}
function ensureSrs(cid){if(!S.srs[cid])S.srs[cid]={ef:2.5,int:0,reps:0,due:today()};return S.srs[cid];}
function activateSrs(id){srsCardsFor(id).forEach(ensureSrs);save();}
function dueCards(){const t=dnum(today());return Object.keys(S.srs).filter(cid=>dnum(S.srs[cid].due)<=t);}
function gradeSrs(cid,q){
  const c=ensureSrs(cid);
  if(q<3){c.reps=0;c.int=0;c.due=today()}
  else{
    c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));c.reps++;
    if(c.reps===1)c.int=1;else if(c.reps===2)c.int=3;else c.int=Math.round(c.int*c.ef);
    const nd=new Date();nd.setDate(nd.getDate()+c.int);c.due=nd.toISOString().slice(0,10);
  }
  save();
}
function srsFront(cid){const [id,kind]=cid.split(':');const d=byId(id);if(!d)return'';
  return (kind==='def'?'🛡️ Ta meilleure DÉFENSE sur :':'⚔️ La FAILLE de l\'adversaire sur :')+'<br><b style="color:var(--acc2)">'+d.titre+'</b>';}
function srsBack(cid){const [id,kind]=cid.split(':');const d=byId(id);return kind==='def'?d.defense:d.faille}

/* ================= RENDER ================= */
function render(){
  paintHead();
  if(TAB==='arene')renderArene();
  else if(TAB==='positions')renderPositions();
  else if(TAB==='masterclass')renderMasterclass();
  else if(TAB==='verdict')renderVerdict();
  else if(TAB==='carnet')renderCarnet();
  else if(TAB==='revision')renderRevision();
  else renderProfil();
  renderNav();window.scrollTo(0,0);
}
function renderNav(){
  const items=[['arene','🥊','Arène'],['positions','📜','Positions'],['masterclass','🎓','Cours'],['carnet','✍️','Carnet'],['revision','🔁','Révision'],['profil','📊','Profil']];
  $('#nav').innerHTML=items.map(([r,ic,l])=>
    `<div class="nav-i ${TAB===r?'on':''}" onclick="go('${r}')"><div class="ic">${ic}</div><span>${l}</span></div>`).join('');
}
function go(t){MCOPEN=null;OPEN=null;CARNET_EDIT=null;CARNET_EXPORT=null;VREV={};DOSSIER=null;DRILL=null;REVTAB='munitions';TAB=t;render()}
function goFiches(){MCOPEN=null;DOSSIER=null;DRILL=null;REVTAB='fiches';TAB='revision';render()}

/* ---------- LE VERDICT (⚖️ faits vs valeurs) ---------- */
let VREV={};
function revealVerdict(id){
  VREV[id]=true;
  if(!S.verdictsSeen[id]){S.verdictsSeen[id]=today();addXp(3);toast('+3 XP · verdict');}
  render();
}
function verdictToDuel(id){TAB='arene';startDuel(id);}
function renderVerdict(){
  const seen=Object.keys(S.verdictsSeen).length, tot=Object.keys(VERDICTS).length;
  let h=`<button class="btn ghost small" onclick="go('arene')">← Arène</button>
    <h1 class="page">⚖️ Le Verdict</h1>
    <div class="page-sub">Ce que les <b>faits tranchent</b> vs ce qui reste ton <b>choix de valeurs</b>. Pense d'abord, puis révèle. — <b>${seen}/${tot}</b> révélés</div>`;
  THEMES.forEach(th=>{
    const list=DEBATS.filter(d=>d.theme===th && VERDICTS[d.id]);
    if(!list.length)return;
    h+=`<div class="mini" style="margin:16px 2px 4px">${th}</div>`;
    list.forEach(d=>{
      const v=VERDICTS[d.id];
      h+=`<div class="card"><span class="tag th">${d.theme}</span>
        <div style="font-size:16px;font-weight:900;margin:8px 0 2px">${d.titre}</div>`;
      if(!VREV[d.id]){
        h+=`<div class="prompt">Qu'est-ce que les faits tranchent ici — et qu'est-ce qui reste un choix de valeurs ?</div>
          <button class="btn study small" onclick="revealVerdict('${d.id}')">Révéler le verdict ⚖️</button>`;
      }else{
        h+=`<div class="reveal study"><span class="lbl">🔬 Ce que les faits tranchent</span>${v.faits}</div>
          <div class="reveal def"><span class="lbl">🧭 Ce qui reste ton choix de valeurs</span>${v.valeurs}</div>
          <button class="btn ghost small" onclick="verdictToDuel('${d.id}')">→ Le débat complet</button>`;
      }
      h+=`</div>`;
    });
  });
  $('#main').innerHTML=h;
}

/* ---------- ARÈNE ---------- */
let SESS=null;
function renderArene(){
  const li=levelIdx();const lv=LEVELS[li];const nx=LEVELS[li+1];
  const cur=S.xp-lv.xp;const span=nx?nx.xp-lv.xp:1;const pct=nx?Math.min(100,cur/span*100):100;
  const t=today();const dueN=dueCards().length;const duelDoneToday=(S.done[t]||[]).length>0;

  let h=`<div class="card hero">
    <div class="lvltag">Niveau ${li+1}</div>
    <div class="lvlname">${lv.n}</div>
    <div class="xpbar"><i style="width:${pct}%"></i></div>
    <div class="xptxt"><span>${S.xp} XP</span><span>${nx?(nx.xp-S.xp)+' → '+nx.n:'niveau max'}</span></div>
  </div>`;

  if(SESS){h+=renderSession();$('#main').innerHTML=h;return;}

  h+=`<div class="card">
    <div class="mini" style="margin-bottom:6px">Séance du jour</div>
    <div class="quest ${duelDoneToday?'done':''}"><div class="qi">🥊</div><div class="qt"><b>Le duel du jour</b><small>Défends ta position, démonte l'adverse</small></div><div class="qx">${duelDoneToday?'✓':'à faire'}</div></div>
    <div class="quest ${dueN===0?'done':''}"><div class="qi">🔁</div><div class="qt"><b>Réviser tes munitions</b><small>${dueN} carte${dueN>1?'s':''} à revoir</small></div><div class="qx">${dueN===0?'✓':dueN}</div></div>
  </div>`;

  const did=duelOfDay();const d=byId(did);
  h+=`<h1 class="page">🥊 Le duel du jour</h1>
    <div class="page-sub">${d.theme} · production active — écris <i>avant</i> de révéler.</div>
    <div class="card">
      <span class="tag th">${d.theme}</span>
      <div style="font-size:18px;font-weight:900;margin:10px 0 2px">${d.titre}</div>
      <button class="btn" onclick="startDuel('${d.id}')">Entrer dans l'arène →</button>
      ${duelDoneToday?`<button class="btn ghost small" onclick="startDuel('${pickDuel(did)}')">Enchaîner un autre duel</button>`:''}
    </div>`;
  h+=`<div class="card" onclick="go('masterclass')" style="cursor:pointer"><div class="quest" style="padding:2px 0;border:none"><div class="qi">🎓</div><div class="qt"><b>Masterclass</b><small>Te former sur un sujet avant d'avoir un avis</small></div><div class="qx">→</div></div></div>`;
  const _dueF=(typeof DOSSIERS!=='undefined'?DOSSIERS:[]).reduce((n,d)=>n+dossierDue(d).length,0);
  h+=`<div class="card" onclick="goFiches()" style="cursor:pointer"><div class="quest" style="padding:2px 0;border:none"><div class="qi">📇</div><div class="qt"><b>Les Fiches</b><small>Réviser les chiffres & dates de fond${_dueF?' · '+_dueF+' à revoir':''}</small></div><div class="qx">→</div></div></div>`;
  const _vseen=Object.keys(S.verdictsSeen).length, _vtot=Object.keys(VERDICTS).length;

/* --- Fiches : dossiers de révision factuelle (chiffres & événements) --- */
function dosById(id){return (typeof DOSSIERS!=='undefined'?DOSSIERS:[]).find(d=>d.id===id)}
function dossierCards(d){const out=[];d.groupes.forEach((g,gi)=>g.cartes.forEach((c,ci)=>out.push({cid:d.id+'#'+gi+'.'+ci,q:c.q,r:c.r,groupe:g.nom})));return out;}
function ensureMemo(cid){if(!S.memo[cid])S.memo[cid]={ef:2.5,int:0,reps:0,due:today()};return S.memo[cid];}
function memoDueQ(cid){const m=S.memo[cid];return !m || dnum(m.due)<=dnum(today());}
function dossierDue(d){return dossierCards(d).filter(c=>memoDueQ(c.cid));}
function memoGrade(cid,q){
  const c=ensureMemo(cid);
  if(q<3){c.reps=0;c.int=0;c.due=today();}
  else{c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));c.reps++;
    if(c.reps===1)c.int=1;else if(c.reps===2)c.int=3;else c.int=Math.round(c.int*c.ef);
    const nd=new Date();nd.setDate(nd.getDate()+c.int);c.due=nd.toISOString().slice(0,10);}
  save();
}
function revFichesHtml(){
  const list=(typeof DOSSIERS!=='undefined'?DOSSIERS:[]);
  if(!list.length)return `<div class="empty">Aucun dossier pour l'instant.<br>Dis-moi un sujet et j'en construis un.</div>`;
  let h=`<div class="sub" style="margin:-4px 2px 12px">Parcours un dossier pour lire, ou révise-le en rappel actif.</div>`;
  list.forEach(d=>{
    const tot=dossierCards(d).length, due=dossierDue(d).length;
    h+=`<div class="positem" onclick="openDossier('${d.id}')"><div class="pt"><b>${d.emoji} ${d.titre}</b>
      <span class="chev" style="color:${due?'var(--att)':'var(--ok)'};font-weight:800">${due?due+' à revoir':'✓ à jour'}</span></div>
      <div class="sub" style="margin-top:6px">${d.sub} · ${tot} fiches</div></div>`;
  });
  return h;
}

function renderDossier(){
  const d=dosById(DOSSIER);if(!d){DOSSIER=null;return renderRevision();}
  const due=dossierDue(d).length, tot=dossierCards(d).length;
  let h=`<button class="btn ghost small" onclick="closeDossier()" style="margin:0 0 12px;width:auto;display:inline-block;padding:8px 14px">← Fiches</button>
    <h1 class="page">${d.emoji} ${d.titre}</h1><div class="page-sub">${d.sub}</div>
    <button class="btn study" onclick="startDrill('${d.id}',false)">🎯 Réviser ${due?('('+due+' à revoir)'):'(tout le dossier)'}</button>`;
  if(due&&due<tot)h+=`<button class="btn ghost small" onclick="startDrill('${d.id}',true)">Revoir tout le dossier (${tot})</button>`;
  d.groupes.forEach(g=>{
    h+=`<div class="mini" style="margin:18px 2px 6px">${g.nom}</div><div class="card" style="padding:4px 15px">`;
    g.cartes.forEach(c=>{h+=`<div class="estudy"><b style="color:var(--acc2)">${c.q}</b><div style="color:#cfd6ea;margin-top:3px">${c.r}</div></div>`;});
    h+=`</div>`;
  });
  $('#main').innerHTML=h;
}
function startDrill(id,all){
  const d=dosById(id);if(!d)return;
  let cards=dossierCards(d);
  if(!all){const due=cards.filter(c=>memoDueQ(c.cid));if(due.length)cards=due;}
  cards=cards.slice().sort(()=>Math.random()-0.5);
  DRILL={dosId:id,queue:cards,i:0,show:false,total:cards.length,streaked:false};
  render();
}
function drillShow(){DRILL.show=true;render();}
function drillGrade(q){const card=DRILL.queue[DRILL.i];memoGrade(card.cid,q);addXp(q>=5?3:q>=3?2:1);DRILL.i++;DRILL.show=false;render();}
function endDrill(){DRILL=null;render();}
function renderDrill(){
  const d=dosById(DRILL.dosId);
  if(DRILL.i>=DRILL.queue.length){
    if(!DRILL.streaked){bumpStreak();DRILL.streaked=true;}
    $('#main').innerHTML=`<h1 class="page">🎯 Terminé</h1><div class="page-sub">${d.emoji} ${d.titre}</div>
      <div class="card" style="text-align:center;padding:26px 16px"><div style="font-size:38px">✓</div>
        <div style="font-size:17px;font-weight:800;margin-top:8px">${DRILL.total} fiche${DRILL.total>1?'s':''} révisée${DRILL.total>1?'s':''}</div>
        <div class="sub" style="margin-top:6px">Les fiches ratées reviendront plus tôt (répétition espacée).</div></div>
      <button class="btn study" onclick="startDrill('${DRILL.dosId}',false)">Continuer à réviser</button>
      <button class="btn ghost small" onclick="endDrill()">← Retour aux fiches</button>`;
    return;
  }
  const card=DRILL.queue[DRILL.i];
  let h=`<button class="btn ghost small" onclick="endDrill()" style="margin:0 0 12px;width:auto;display:inline-block;padding:8px 14px">← Quitter</button>
    <h1 class="page">🎯 ${d.titre}</h1>
    <div class="page-sub">${DRILL.i+1} / ${DRILL.queue.length} · <span style="color:var(--study)">${card.groupe}</span></div>
    <div class="srs-card"><div class="srs-front">${card.q}</div>`;
  if(DRILL.show)h+=`<div class="srs-back">${card.r}</div>`;
  h+=`</div>`;
  if(!DRILL.show)h+=`<button class="btn study" onclick="drillShow()">Révéler la réponse</button>`;
  else h+=`<div class="prompt" style="text-align:center;margin-top:12px">Tu l'avais ?</div>
    <div class="row3"><button class="btn ghost small" onclick="drillGrade(0)">Raté</button>
      <button class="btn ghost small" onclick="drillGrade(3)">Presque</button>
      <button class="btn study small" onclick="drillGrade(5)">Su</button></div>`;
  $('#main').innerHTML=h;
}
function mcToDossier(id){MCOPEN=null;DRILL=null;REVTAB='fiches';TAB='revision';openDossier(id);}

/* ---------- PROFIL ---------- */
function renderProfil(){
  const li=levelIdx();const lv=LEVELS[li];
  const seenN=Object.keys(S.seen).length;const srsN=Object.keys(S.srs).length;
  const mature=Object.values(S.srs).filter(c=>c.int>=7).length;
  let h=`<h1 class="page">📊 Profil</h1><div class="page-sub">Ta progression de débatteur.</div>
  <div class="card hero"><div class="lvltag">Niveau ${li+1} · ${S.xp} XP</div><div class="lvlname">${lv.n}</div></div>
  <div class="stats">
    <div class="stat"><b>${seenN}</b><small>débats travaillés</small></div>
    <div class="stat"><b>${S.streak}</b><small>jours de série</small></div>
    <div class="stat"><b>${mature}/${srsN||0}</b><small>munitions ancrées</small></div>
  </div>`;
  h+=`<div class="card"><div class="mini" style="margin-bottom:8px">Couverture par thème</div>`;
  THEMES.forEach(th=>{const list=DEBATS.filter(d=>d.theme===th);const done=list.filter(d=>S.seen[d.id]).length;
    const pct=list.length?done/list.length*100:0;
    h+=`<div class="thbar"><div class="tn">${th}</div><div class="tt"><i style="width:${pct}%"></i></div><div class="tv">${done}/${list.length}</div></div>`;});
  h+=`</div>`;
  h+=`<div class="card"><div class="mini" style="margin-bottom:6px">À propos</div>
    <div class="sub">L'ARÈNE entraîne la défense de tes convictions : chaque duel te fait produire ta défense et l'estocade <i>avant</i> de révéler les munitions, les études et les sources. Profil construit avec Claude (2026). Enrichis-le en continuant à débattre.</div></div>`;
  h+=`<button class="btn ghost small" onclick="resetConfirm()">Réinitialiser ma progression</button>`;
  $('#main').innerHTML=h;
}
function resetConfirm(){if(confirm('Effacer XP, série et révisions ? (le contenu des débats reste)')){localStorage.removeItem('arene_state');location.reload();}}

/* ---------- boot ---------- */
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
